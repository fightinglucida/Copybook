baseURL = "https://pan.linshutech.com/"
languageCode = "zh-CN"
title = "技能之书"
timeZone = "Asia/Shanghai"

enableRobotsTXT = true
enableEmoji = true
enableGitInfo = true
canonifyURLs = false

[pagination]
  pagerSize = 20

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[taxonomies]
  tag = 'tags'
  category = 'categories'

[params]
  description = "技能之书 ▪ 通识技能与优质资源分享站，持续更新"
  og_image = "/images/og.jpg"
  sitename = "技能之书"
  channel = "https://t.me/linshufighting"

[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[params.wechat_benchmark]
  download_password = "" # 对标库通用口令，仅在构建时读取
  purchase_url = "" # 第三方发码平台的 HTTPS 商品链接

[params.author]
  name = "Lucida"
  github = "fightinglucida"
  twitter = "fightinglucida"


[mediaTypes]
  [mediaTypes."text/css"]
    suffixes = ["css"]
    mediaType = "text/css"

[outputFormats]
  [outputFormats.CSS]
    mediaType = "text/css"
    isPlainText = true
    isHTML = false
    isRSS = false
    isSitemap = false
    notAlternative = true

[build]
  [[build.cachebusters]]
    source = 'layouts/.*'
    target = 'css'



[resources]
  [resources.transforms]
    [resources.transforms.PostCSS]
      enabled = true
      config = "tailwind.config.js"
      source = "assets/css/main.css"
      target = "css/main.css"
      minify = true

# Keep raw archive files out of Hugo's content and publish only the importer output.
[[module.mounts]]
  source = "content"
  target = "content"
  excludeFiles = ["gzh/**"]
[[module.mounts]]
  source = "content/gzh/_index.md"
  target = "content/gzh/_index.md"
[[module.mounts]]
  source = ".local/wechat-accounts/content"
  target = "content/gzh"
[[module.mounts]]
  source = "data"
  target = "data"
[[module.mounts]]
  source = ".local/wechat-accounts/data"
  target = "data"
[[module.mounts]]
  source = "assets"
  target = "assets"
[[module.mounts]]
  source = ".local/wechat-accounts/articles"
  target = "assets/gzh/imported"
[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  source = ".local/wechat-accounts/media"
  target = "static/gzh-media"
