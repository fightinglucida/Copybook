backend:
  name: git-gateway
  branch: main
media_folder: static/images
public_folder: /images
site_url: "https://copybook-3w6.pages.dev/"
display_url: "https://copybook-3w6.pages.dev/"
logo_url: /images/logo.svg
collections:
  - name: "Content"
    identifier_field: body
    label: "Content"
    folder: "content"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "文章标题", name: "title", widget: "string", required: true }
      - { label: "首页置顶", name: "pinned", widget: "boolean", required: false, default: false, hint: "置顶帖排在首页最前面；多篇置顶帖按发布时间从新到旧排序。" }
      - { label: "激活码解锁下载", name: "paid", widget: "boolean", required: false, default: false }
      - { label: "受保护资源编号（须与授权系统一致）", name: "resource_id", widget: "string", required: false }
      - { label: "购买激活码地址", name: "purchase_url", widget: "string", required: false }
      - { label: "发布时间", name: "date", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: "HH:mm" }
      - { label: "原资源链接（兼容旧文章）", name: "link", widget: "string", required: false }
      - name: "downloads"
        label: "文末网盘下载"
        widget: "object"
        required: false
        fields:
          - name: "baidu"
            label: "百度网盘"
            widget: "object"
            required: false
            fields:
              - { label: "分享链接", name: "url", widget: "string", required: false }
              - { label: "提取码", name: "code", widget: "string", required: false }
          - name: "quark"
            label: "夸克网盘"
            widget: "object"
            required: false
            fields:
              - { label: "分享链接", name: "url", widget: "string", required: false }
              - { label: "提取码", name: "code", widget: "string", required: false }
      - name: "mood"
        label: "Mood"
        widget: "create-select"
        mode: "xml"
        url: "/mood/index.xml"
        query: "item > title"
        multiple: false
        required: true
      - name: "categories"
        label: "Categories"
        widget: "create-select"
        mode: "xml"
        url: "/categories/index.xml"
        query: "item > title"
        multiple: false
        required: true
      - name: "tags"
        label: "Tags"
        widget: "create-select"
        mode: "xml"
        url: "/tags/index.xml"
        query: "item > title"
        multiple: true
        required: true
      - { label: "Body", name: "body", widget: "markdown", required: true }
